########################################################################
#  bookRoot – Profil: prod
#  Konfiguracja produkcyjna (PostgreSQL przez zmienne środowiskowe)
#
#  Wymagane zmienne środowiskowe:
#    JDBC_DATABASE_URL       – JDBC URL do PostgreSQL (np. jdbc:postgresql://...)
#    JDBC_DATABASE_USERNAME  – nazwa użytkownika bazy
#    JDBC_DATABASE_PASSWORD  – hasło użytkownika bazy
#    PORT (opcjonalne)       – port HTTP, domyślnie 8080
########################################################################
server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${JDBC_DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${JDBC_DATABASE_USERNAME}
    password: ${JDBC_DATABASE_PASSWORD}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: bookRoot-prod-pool

  jpa:
    hibernate:
      ddl-auto: validate         # Produkcja: NIE modyfikuj schematu – tylko weryfikuj
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # H2 Console wyłączona w produkcji
  h2:
    console:
      enabled: false

  # DevTools wyłączone w produkcji
  devtools:
    restart:
      enabled: false

logging:
  level:
    pl.studyshare: INFO
    org.springframework.security: WARN
    org.hibernate: WARN