########################################################################
#  bookRoot – Konfiguracja bazowa
#  Profil domyślny: dev (H2 in-memory)
#  Aby użyć PostgreSQL lokalnie: uruchom z profilu 'postgres'
#    Idea: Edit Configurations → Active Profiles: postgres
#    CLI: java -Dspring.profiles.active=postgres -jar bookroot.jar
#  Produkcja (render.com / Heroku):
#    Ustaw zmienna: SPRING_PROFILES_ACTIVE=prod
########################################################################

spring.application.name=bookRoot

# ─── Aktywny profil domyślny ────────────────────────────────────────────────
spring.profiles.active=dev

# ─── H2 Console (dostępna tylko w profilu dev) ──────────────────────────────
spring.h2.console.enabled=false