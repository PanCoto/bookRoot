<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bookRoot - Publiczna Tablica Wiedzy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header role="banner">
    <h1>bookRoot (StudyShare)</h1>
    <nav role="navigation" aria-label="Menu główne">
        <a href="/">Główna</a>
        <span sec:authorize="!isAuthenticated()">
            <a th:href="@{/login}">Zaloguj</a>
            <a th:href="@{/register}">Rejestracja</a>
        </span>
        <span sec:authorize="isAuthenticated()">
            Witaj, <span sec:authentication="name"></span>
            <a th:href="@{/profile/edit}">Profil</a>
            <form th:action="@{/logout}" method="post" style="display:inline">
                <button type="submit">Wyloguj</button>
            </form>
        </span>
    </nav>
</header>

<main role="main">
    <h2>Publiczna Tablica Wiedzy</h2>
    <th:block th:if="${#lists.isEmpty(tasks)}">
        <p>Brak zatwierdzonych zadań do wyświetlenia.</p>
    </th:block>
    <th:block th:unless="${#lists.isEmpty(tasks)}">
        <div th:each="task : ${tasks}" class="task-card">
            <h3 th:text="${task.title}">Tytuł</h3>
            <p th:text="${#strings.abbreviate(task.content, 150)}">Zajawka treści</p>
            <span th:text="${task.categoryName}">kategoria</span>
            <span th:if="${!task.anonymous}" th:text="${task.authorName}">autor</span>
            <span th:if="${task.anonymous}">Anonim</span>
        </div>
    </th:block>
</main>

<footer role="contentinfo">
    <p>&copy; 2026 bookRoot</p>
</footer>
</body>
</html>
