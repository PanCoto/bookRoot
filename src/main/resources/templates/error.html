<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Błąd – bookRoot</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header role="banner">
    <h1>bookRoot</h1>
    <nav><a href="/">Strona główna</a></nav>
</header>

<main role="main" class="container error-page">
    <h2>Wystąpił błąd</h2>

    <p>Wróć do <a href="/">strony głównej</a>.</p>
</main>

<footer role="contentinfo">
    <p>&copy; 2026 bookRoot</p>
</footer>
</body>
</html>
