<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Zarejestruj się w bookRoot – platforma edukacyjna dla studentów.">
    <title>Rejestracja – bookRoot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<main role="main" class="flex-grow-1 py-5">
    <div class="container" style="max-width:500px;">
        <div class="card shadow border-0">
            <div class="card-header bg-dark text-white text-center py-3">
                <h1 class="h4 mb-0 fw-bold">
                    <span style="color:#f97316;"></span> bookRoot
                </h1>
                <p class="mb-0 small text-white-50">Utwórz nowe konto</p>
            </div>
            <div class="card-body p-4">

                <form th:action="@{/register}"
                      th:object="${userRegisterRequest}"
                      method="post" novalidate>

                    <!-- Imię -->
                    <div class="mb-3">
                        <label for="firstName" class="form-label fw-semibold small">Imię</label>
                        <input type="text" id="firstName" th:field="*{firstName}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('firstName')} ? ' is-invalid'"
                               required pattern="[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+"
                               placeholder="np. Jan" autocomplete="given-name">
                        <div class="form-text small text-muted">Zacznij wielką literą, tylko litery.</div>
                        <div th:if="${#fields.hasErrors('firstName')}"
                             th:errors="*{firstName}"
                             class="invalid-feedback" role="alert"></div>
                    </div>

                    <!-- Nazwisko -->
                    <div class="mb-3">
                        <label for="lastName" class="form-label fw-semibold small">Nazwisko</label>
                        <input type="text" id="lastName" th:field="*{lastName}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('lastName')} ? ' is-invalid'"
                               required pattern="[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+"
                               placeholder="np. Kowalski" autocomplete="family-name">
                        <div th:if="${#fields.hasErrors('lastName')}"
                             th:errors="*{lastName}"
                             class="invalid-feedback" role="alert"></div>
                    </div>

                    <!-- Login -->
                    <div class="mb-3">
                        <label for="login" class="form-label fw-semibold small">Login</label>
                        <input type="text" id="login" th:field="*{login}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('login')} ? ' is-invalid'"
                               required pattern="[a-z]+" minlength="3" maxlength="20"
                               placeholder="Tylko małe litery, 3-20 znaków" autocomplete="username">
                        <div th:if="${loginExists}"
                             class="invalid-feedback d-block" role="alert">
                            Podany login jest już zajęty.
                        </div>
                        <div th:if="${#fields.hasErrors('login')}"
                             th:errors="*{login}"
                             class="invalid-feedback" role="alert"></div>
                    </div>

                    <!-- Email (opcjonalny) -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold small">
                            E-mail <span class="text-muted fw-normal">(opcjonalny)</span>
                        </label>
                        <input type="email" id="email" th:field="*{email}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'"
                               placeholder="np. jan@uczelnia.pl" autocomplete="email">
                        <div th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}"
                             class="invalid-feedback" role="alert"></div>
                    </div>

                    <!-- Hasło -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold small">Hasło</label>
                        <input type="password" id="password" th:field="*{password}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('password')} ? ' is-invalid'"
                               required minlength="5"
                               placeholder="Min. 5 znaków" autocomplete="new-password">
                        <div th:if="${#fields.hasErrors('password')}"
                             th:errors="*{password}"
                             class="invalid-feedback" role="alert"></div>
                    </div>

                    <!-- Wiek (V4: @Min(18)) -->
                    <div class="mb-4">
                        <label for="age" class="form-label fw-semibold small">Wiek</label>
                        <input type="number" id="age" th:field="*{age}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('age')} ? ' is-invalid'"
                               required min="18" max="120"
                               placeholder="Minimum 18 lat">
                        <div th:if="${#fields.hasErrors('age')}"
                             th:errors="*{age}"
                             class="invalid-feedback" role="alert"></div>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 fw-semibold"
                            aria-label="Utwórz konto">
                        Zarejestruj się
                    </button>
                </form>
            </div>
            <div class="card-footer bg-white text-center py-3">
                <small class="text-muted">
                    Masz już konto?
                    <a th:href="@{/login}" class="fw-semibold text-decoration-none"
                       aria-label="Przejdź do logowania">Zaloguj się</a>
                </small>
            </div>
        </div>
    </div>
</main>

<footer class="py-3 bg-dark text-white text-center" role="contentinfo">
    <small class="text-white-50">&copy; 2026 bookRoot</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
