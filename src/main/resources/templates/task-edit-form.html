<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edytuj zadanie – bookRoot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<main role="main" class="flex-grow-1 py-4">
    <div class="container" style="max-width:700px;">

        <div class="mb-4 d-flex align-items-center gap-2">
            <a th:href="@{/tasks/{id}(id=${taskId})}" class="btn btn-outline-secondary btn-sm"
               aria-label="Wróć do zadania">← Wróć</a>
            <h1 class="h3 fw-bold mb-0">Edytuj zadanie</h1>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form th:action="@{/tasks/{id}/edit(id=${taskId})}"
                      th:object="${taskUpdateRequest}"
                      method="post" novalidate>

                    <!-- Tytuł -->
                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold small">Tytuł zadania</label>
                        <input type="text" id="title" th:field="*{title}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('title')} ? ' is-invalid'"
                               required minlength="5" maxlength="200">
                        <div th:if="${#fields.hasErrors('title')}"
                             th:errors="*{title}"
                             class="invalid-feedback" role="alert"></div>
                    </div>

                    <!-- Kategoria -->
                    <div class="mb-3">
                        <label for="categoryId" class="form-label fw-semibold small">Kategoria</label>
                        <select id="categoryId" th:field="*{categoryId}"
                                class="form-select"
                                th:classappend="${#fields.hasErrors('categoryId')} ? ' is-invalid'"
                                required>
                            <option value="">-- Wybierz kategorię --</option>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat.id}"
                                    th:text="${cat.name}">Kategoria</option>
                        </select>
                        <div th:if="${#fields.hasErrors('categoryId')}"
                             th:errors="*{categoryId}"
                             class="invalid-feedback" role="alert"></div>
                    </div>

                    <!-- Treść -->
                    <div class="mb-3">
                        <label for="content" class="form-label fw-semibold small">Treść zadania</label>
                        <textarea id="content" th:field="*{content}"
                                  class="form-control"
                                  th:classappend="${#fields.hasErrors('content')} ? ' is-invalid'"
                                  rows="8" required minlength="10"></textarea>
                        <div th:if="${#fields.hasErrors('content')}"
                             th:errors="*{content}"
                             class="invalid-feedback" role="alert"></div>
                    </div>

                    <!-- Status (only for ADMIN) -->
                    <div class="mb-4" sec:authorize="hasRole('ADMIN')">
                        <label for="status" class="form-label fw-semibold small">Status (Admin)</label>
                        <select id="status" th:field="*{status}" class="form-select form-select-sm">
                            <option value="DRAFT">DRAFT</option>
                            <option value="PENDING">PENDING</option>
                            <option value="APPROVED">APPROVED</option>
                            <option value="REJECTED">REJECTED</option>
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary fw-semibold"
                                aria-label="Zapisz zmiany w zadaniu">
                            Zapisz zmiany
                        </button>
                        <a th:href="@{/tasks/{id}(id=${taskId})}" class="btn btn-outline-secondary"
                           aria-label="Anuluj edycję">
                            Anuluj
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmxI3wH4U+VE4PVjuoFh60drI4L6N"
        crossorigin="anonymous"></script>
</body>
</html>
