<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!--/* ─────────────────────────────────────────────────────────────────
       bookRoot – Shared Header / Navbar (Bootstrap 5)
       Usage: <div th:replace="~{fragments/header :: header}"></div>
   ───────────────────────────────────────────────────────────────── */-->

<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm" aria-label="Główna nawigacja">
        <div class="container-fluid">

            <!-- Brand -->
            <a class="navbar-brand fw-bold fs-4" th:href="@{/}">
                <span style="color:#f97316;">📚</span> bookRoot
            </a>

            <!-- Mobile toggle -->
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarMain"
                    aria-controls="navbarMain" aria-expanded="false" aria-label="Przełącz nawigację">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMain">

                <!-- Left links -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" aria-label="Strona główna">Główna</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/tasks}" aria-label="Lista zadań">Zadania</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link btn btn-sm btn-outline-warning ms-2 px-3" th:href="@{/tasks/new}"
                           aria-label="Dodaj nowe zadanie">
                            + Dodaj zadanie
                        </a>
                    </li>
                </ul>

                <!-- Right – auth -->
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center gap-2">

                    <!-- ADMIN badge + panel -->
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link badge bg-danger text-white text-decoration-none"
                           th:href="@{/admin}" aria-label="Panel administratora">
                            ⚙ Admin
                        </a>
                    </li>

                    <!-- Logged in -->
                    <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown"
                           role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            👤 <span sec:authentication="name">Użytkownik</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li>
                                <a class="dropdown-item" th:href="@{/profile/edit}">Mój profil</a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="d-inline w-100">
                                    <button type="submit" class="dropdown-item text-danger"
                                            aria-label="Wyloguj się">
                                        Wyloguj
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>

                    <!-- Not logged in -->
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/login}" aria-label="Zaloguj się">Zaloguj</a>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="btn btn-outline-warning btn-sm" th:href="@{/register}"
                           aria-label="Zarejestruj się">Zarejestruj</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
</header>

</body>
</html>
