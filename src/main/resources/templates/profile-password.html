<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zmiana hasła – bookRoot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<main role="main" class="flex-grow-1 py-5">
    <div class="container" style="max-width:600px;">

        <h1 class="h3 fw-bold mb-4">Zmiana hasła</h1>

        <div th:if="${param.success}" class="alert alert-success" role="alert">
            Hasło zostało zaktualizowane pomyślnie.
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form th:action="@{/profile/password}"
                      th:object="${changePasswordRequest}"
                      method="post" novalidate>

                    <div class="mb-3">
                        <label for="currentPassword" class="form-label fw-semibold small">Aktualne hasło</label>
                        <input type="password" id="currentPassword" th:field="*{currentPassword}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('currentPassword')} ? ' is-invalid'"
                               required>
                        <div th:if="${#fields.hasErrors('currentPassword')}"
                             th:errors="*{currentPassword}"
                             class="invalid-feedback" role="alert"></div>
                    </div>

                    <div class="mb-3">
                        <label for="newPassword" class="form-label fw-semibold small">Nowe hasło</label>
                        <input type="password" id="newPassword" th:field="*{newPassword}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('newPassword')} ? ' is-invalid'"
                               required>
                        <div th:if="${#fields.hasErrors('newPassword')}"
                             th:errors="*{newPassword}"
                             class="invalid-feedback" role="alert"></div>
                    </div>

                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label fw-semibold small">Potwierdź nowe hasło</label>
                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? ' is-invalid'"
                               required>
                        <div th:if="${#fields.hasErrors('confirmPassword')}"
                             th:errors="*{confirmPassword}"
                             class="invalid-feedback" role="alert"></div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning fw-semibold text-dark"
                                aria-label="Zmień hasło">
                            Zmień hasło
                        </button>
                        <a th:href="@{/profile/edit}" class="btn btn-outline-secondary"
                           aria-label="Powrót do edycji profilu">
                            Wróć
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmxI3wH4U+VE4PVjuoFh60drI4L6N"
        crossorigin="anonymous"></script>
</body>
</html>
