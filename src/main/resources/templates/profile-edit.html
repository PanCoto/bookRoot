<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mój profil – bookRoot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<main role="main" class="flex-grow-1 py-5">
    <div class="container" style="max-width:600px;">

        <h1 class="h3 fw-bold mb-4">Mój profil</h1>

        <!-- Success flash -->
        <div th:if="${param.success}" class="alert alert-success" role="alert">
            Profil został zaktualizowany.
        </div>
        <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

        <!-- Avatar upload card -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4 text-center">
                <div class="mb-3">
                    <img th:if="${userProfile.avatarFilename != null}" th:src="'/uploads/avatars/' + ${userProfile.avatarFilename}"
                         alt="Avatar" class="rounded-circle border border-3 border-warning shadow-sm" style="width: 120px; height: 120px; object-fit: cover;">
                    <div th:unless="${userProfile.avatarFilename != null}" class="d-inline-flex align-items-center justify-content-center bg-secondary text-white rounded-circle border border-3 border-warning shadow-sm" style="width: 120px; height: 120px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-person-fill" viewBox="0 0 16 16">
                            <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                        </svg>
                    </div>
                </div>
                <form th:action="@{/profile/edit/avatar}" method="post" enctype="multipart/form-data" class="d-inline-block">
                    <div class="mb-3 text-start" style="max-width: 320px;">
                        <label for="avatarFile" class="form-label fw-semibold small text-muted mb-1">Zmień zdjęcie profilowe</label>
                        <div class="d-flex gap-2">
                            <input class="form-control form-control-sm" type="file" id="avatarFile" name="avatar" accept="image/*" required>
                            <button type="submit" class="btn btn-dark btn-sm fw-semibold">Wgraj</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form th:action="@{/profile/edit}"
                      th:object="${userProfile}"
                      method="post" novalidate>

                    <!-- Imię -->
                    <div class="mb-3">
                        <label for="firstName" class="form-label fw-semibold small">Imię</label>
                        <input type="text" id="firstName" th:field="*{firstName}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('firstName')} ? ' is-invalid'"
                               required>
                        <div th:if="${#fields.hasErrors('firstName')}"
                             th:errors="*{firstName}"
                             class="invalid-feedback" role="alert"></div>
                    </div>

                    <!-- Nazwisko -->
                    <div class="mb-3">
                        <label for="lastName" class="form-label fw-semibold small">Nazwisko</label>
                        <input type="text" id="lastName" th:field="*{lastName}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('lastName')} ? ' is-invalid'"
                               required>
                        <div th:if="${#fields.hasErrors('lastName')}"
                             th:errors="*{lastName}"
                             class="invalid-feedback" role="alert"></div>
                    </div>

                    <!-- Wiek -->
                    <div class="mb-3">
                        <label for="age" class="form-label fw-semibold small">Wiek</label>
                        <input type="number" id="age" th:field="*{age}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('age')} ? ' is-invalid'"
                               min="18" max="120" required>
                        <div th:if="${#fields.hasErrors('age')}"
                             th:errors="*{age}"
                             class="invalid-feedback" role="alert"></div>
                    </div>

                    <!-- Nazwa wyświetlana (YAML: displayName) -->
                    <div class="mb-3">
                        <label for="displayName" class="form-label fw-semibold small">
                            Nazwa wyświetlana
                            <span class="text-muted fw-normal">(opcjonalna)</span>
                        </label>
                        <input type="text" id="displayName" th:field="*{displayName}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('displayName')} ? ' is-invalid'"
                               maxlength="80" placeholder="Widoczna dla innych gdy tryb anonimowy jest wyłączony">
                        <div th:if="${#fields.hasErrors('displayName')}"
                             th:errors="*{displayName}"
                             class="invalid-feedback" role="alert"></div>
                    </div>

                    <!-- E-mail -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold small">
                            E-mail <span class="text-muted fw-normal">(opcjonalny)</span>
                        </label>
                        <input type="email" id="email" th:field="*{email}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'"
                               placeholder="np. jan@uczelnia.pl">
                        <div th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}"
                             class="invalid-feedback" role="alert"></div>
                    </div>

                    <!-- Tryb anonimowy -->
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input"
                               th:field="*{anonymousMode}" id="anonymousMode">
                        <label class="form-check-label" for="anonymousMode">
                            Tryb anonimowy – ukryj moje imię i nazwę przy publikacjach
                        </label>
                    </div>

                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary fw-semibold"
                                    aria-label="Zapisz zmiany w profilu">
                                Zapisz zmiany
                            </button>
                            <a th:href="@{/}" class="btn btn-outline-secondary"
                               aria-label="Anuluj i wróć do strony głównej">
                                Anuluj
                            </a>
                        </div>
                        <a th:href="@{/profile/password}" class="btn btn-outline-warning fw-semibold"
                           aria-label="Zmień hasło logowania">
                            Zmień hasło &rarr;
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
