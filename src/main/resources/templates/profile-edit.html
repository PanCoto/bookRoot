<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edytuj profil</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header><h1>Edycja profilu</h1></header>
<main>
    <form th:action="@{/profile/edit}" th:object="${userProfile}" method="post">
        <label>Imię: <input th:field="*{firstName}"></label>
        <div th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="error"></div><br>
        <label>Nazwisko: <input th:field="*{lastName}"></label>
        <div th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="error"></div><br>
        <label>Wiek: <input type="number" th:field="*{age}" min="18"></label>
        <div th:if="${#fields.hasErrors('age')}" th:errors="*{age}" class="error"></div><br>
        <button>Zapisz zmiany</button>
    </form>
</main>
</body>
</html>
