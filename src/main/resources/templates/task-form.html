<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodaj zadanie – bookRoot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main role="main" class="main-content-container flex-grow-1 py-4">
    <div class="container" style="max-width:700px;">

        <div class="mb-4">
            <h1 class="h3 fw-bold mb-0">Dodaj nowe zadanie</h1>
            <p class="text-muted small">Zadanie trafi do kolejki moderacji (status: PENDING)</p>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form th:action="@{/tasks/new}"
                      th:object="${taskCreateRequest}"
                      method="post" novalidate>

                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold small">Tytuł zadania</label>
                        <input type="text" id="title" th:field="*{title}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('title')} ? ' is-invalid'"
                               required minlength="5" maxlength="200"
                               placeholder="Podaj zwięzły tytuł zadania (5-200 znaków)">
                        <div th:if="${#fields.hasErrors('title')}"
                             th:errors="*{title}"
                             class="invalid-feedback" role="alert"></div>
                    </div>

                    <div class="mb-3">
                        <label for="categoryId" class="form-label fw-semibold small">Kategoria</label>
                        <select id="categoryId" th:field="*{categoryId}"
                                class="form-select"
                                th:classappend="${#fields.hasErrors('categoryId')} ? ' is-invalid'"
                                required>
                            <option value="">-- Wybierz kategorię --</option>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat.id}"
                                    th:text="${cat.name}">Kategoria</option>
                        </select>
                        <div th:if="${#fields.hasErrors('categoryId')}"
                             th:errors="*{categoryId}"
                             class="invalid-feedback" role="alert"></div>
                    </div>

                    <div class="mb-3">
                        <label for="taskType" class="form-label fw-semibold small">Typ zadania</label>
                        <select id="taskType" th:field="*{taskType}"
                                class="form-select"
                                th:classappend="${#fields.hasErrors('taskType')} ? ' is-invalid'"
                                required>
                            <option value="OPEN">Otwarte</option>
                            <option value="CLOSED">Zamknięte (jedna odpowiedź)</option>
                            <option value="MULTIPLE_CHOICE">Wielokrotny wybór</option>
                            <option value="TRUE_FALSE">Prawda/Fałsz</option>
                        </select>
                        <div th:if="${#fields.hasErrors('taskType')}"
                             th:errors="*{taskType}"
                             class="invalid-feedback" role="alert"></div>
                    </div>

                    <div class="mb-3">
                        <label for="content" class="form-label fw-semibold small">Treść zadania</label>
                        <textarea id="content" th:field="*{content}"
                                  class="form-control"
                                  th:classappend="${#fields.hasErrors('content')} ? ' is-invalid'"
                                  rows="6" required minlength="10"
                                  placeholder="Opisz dokładnie treść zadania lub pytania..."></textarea>
                        <div th:if="${#fields.hasErrors('content')}"
                             th:errors="*{content}"
                             class="invalid-feedback" role="alert"></div>
                    </div>

                    

                    <div class="mb-3">
                        <label for="sourceUrl" class="form-label fw-semibold small">
                            Źródło / Link <span class="text-muted fw-normal">(opcjonalne)</span>
                        </label>
                        <input type="url" id="sourceUrl" th:field="*{sourceUrl}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('sourceUrl')} ? ' is-invalid'"
                               placeholder="https://...">
                        <div th:if="${#fields.hasErrors('sourceUrl')}"
                             th:errors="*{sourceUrl}"
                             class="invalid-feedback" role="alert"></div>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input"
                               th:field="*{anonymous}" id="anonymous">
                        <label class="form-check-label" for="anonymous">
                            Opublikuj anonimowo (ukryj autora)
                        </label>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning fw-semibold"
                                aria-label="Wyślij zadanie do moderacji">
                            Wyślij do moderacji
                        </button>
                        <a th:href="@{/tasks}" class="btn btn-outline-secondary"
                           aria-label="Anuluj i wróć do listy">
                            Anuluj
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
