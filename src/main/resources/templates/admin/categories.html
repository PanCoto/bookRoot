<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kategorie – bookRoot Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<main role="main" class="flex-grow-1 py-4">
    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 fw-bold mb-0">Zarządzanie kategoriami</h1>
                <p class="text-muted small mb-0">Dodawaj, przeglądaj i usuwaj kategorie zadań</p>
            </div>
            <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm"
               aria-label="Wróć do panelu admina">← Panel admina</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0" aria-label="Lista kategorii zadań">
                                <thead class="table-dark">
                                    <tr>
                                        <th scope="col" style="width: 10%;">ID</th>
                                        <th scope="col" style="width: 50%;">Nazwa</th>
                                        <th scope="col" style="width: 20%;">Liczba zadań</th>
                                        <th scope="col" style="width: 20%;" class="text-end">Akcje</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="cat : ${categories}">
                                        <th scope="row" th:text="${cat.id}">1</th>
                                        <td th:text="${cat.name}" class="fw-semibold">Matematyka</td>
                                        <td th:text="${cat.taskCount}">0</td>
                                        <td class="text-end">
                                            <form th:action="@{/admin/categories/{id}/delete(id=${cat.id})}"
                                                  method="post"
                                                  style="display: inline;"
                                                  onsubmit="return confirm('Czy na pewno chcesz usunąć tę kategorię?');">
                                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                                        aria-label="Usuń kategorię">
                                                    Usuń
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(categories)}">
                                        <td colspan="4" class="text-center py-4 text-muted">
                                            Brak zdefiniowanych kategorii.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white fw-bold py-3">
                        Dodaj nową kategorię
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/admin/categories/new}"
                              th:object="${newCategory}"
                              method="post" novalidate>

                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold small">Nazwa kategorii</label>
                                <input type="text" id="name" th:field="*{name}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'"
                                       placeholder="np. Analiza Matematyczna" required>
                                <div th:if="${#fields.hasErrors('name')}"
                                     th:errors="*{name}"
                                     class="invalid-feedback" role="alert"></div>
                            </div>

                            <div class="mb-4">
                                <label for="description" class="form-label fw-semibold small">Opis (opcjonalny)</label>
                                <textarea id="description" th:field="*{description}"
                                          class="form-control" rows="3"
                                          placeholder="Krótki opis kategorii..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-success w-100 fw-semibold text-white"
                                    aria-label="Zapisz nową kategorię">
                                Zapisz kategorię
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
