<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Użytkownicy – bookRoot Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<main role="main" class="flex-grow-1 py-4">
    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 fw-bold mb-0">Zarządzanie użytkownikami</h1>
                <p class="text-muted small mb-0">Lista wszystkich kont w systemie</p>
            </div>
            <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm"
               aria-label="Wróć do panelu admina">← Panel admina</a>
        </div>

        <div th:if="${param.success}" class="alert alert-success" role="alert">
            Operacja wykonana pomyślnie.
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0" aria-label="Lista użytkowników systemu">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Login</th>
                                <th scope="col">Imię i Nazwisko</th>
                                <th scope="col">E-mail</th>
                                <th scope="col">Rola</th>
                                <th scope="col">Status</th>
                                <th scope="col">Zarejestrowano</th>
                                <th scope="col" class="text-center">Akcje</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}"
                                th:classappend="${!user.active} ? 'table-secondary opacity-75'">
                                <td class="align-middle">
                                    <small class="text-muted" th:text="${user.id}">1</small>
                                </td>
                                <td class="align-middle fw-semibold" th:text="${user.login}">login</td>
                                <td class="align-middle small"
                                    th:text="${user.firstName + ' ' + user.lastName}">Imię Nazwisko</td>
                                <td class="align-middle small text-muted"
                                    th:text="${user.email ?: '—'}">email</td>
                                 <td class="align-middle">
                                     <span class="badge"
                                           th:classappend="${user.role.name() == 'ADMIN'} ? 'bg-danger' : (${user.role.name() == 'MODERATOR'} ? 'bg-info text-dark' : 'bg-secondary')"
                                           th:text="${user.role}">ROLE</span>
                                 </td>
                                 <td class="align-middle">
                                     <span class="badge"
                                           th:classappend="${user.active} ? 'bg-success' : 'bg-secondary'"
                                           th:text="${user.active ? 'Aktywny' : 'Dezaktywowany'}">
                                         Status
                                     </span>
                                 </td>
                                 <td class="align-middle small text-muted"
                                     th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'dd.MM.yyyy') : '—'}">
                                     Data
                                 </td>
                                 <td class="align-middle text-center">
                                     <div class="d-flex gap-1 justify-content-center flex-wrap">
                                         <form th:action="@{/admin/users/{id}/role(id=${user.id})}"
                                               method="post" class="d-inline">
                                             <select name="newRole" class="form-select form-select-sm d-inline-block w-auto"
                                                     th:aria-label="'Zmień rolę dla użytkownika ' + ${user.login}">
                                                 <option value="USER"      th:selected="${user.role.name() == 'USER'}">USER</option>
                                                 <option value="MODERATOR" th:selected="${user.role.name() == 'MODERATOR'}">MODERATOR</option>
                                                 <option value="ADMIN"     th:selected="${user.role.name() == 'ADMIN'}">ADMIN</option>
                                             </select>
                                             <button type="submit" class="btn btn-outline-primary btn-sm"
                                                     th:aria-label="'Zapisz rolę dla ' + ${user.login}">
                                                 Zmień
                                             </button>
                                         </form>
                                        <form th:action="@{/admin/users/{id}/toggle(id=${user.id})}"
                                              method="post" class="d-inline">
                                            <button type="submit"
                                                    class="btn btn-sm"
                                                    th:classappend="${user.active} ? 'btn-outline-danger' : 'btn-outline-success'"
                                                    th:text="${user.active ? 'Dezaktywuj' : 'Aktywuj'}"
                                                    th:aria-label="${user.active ? 'Dezaktywuj użytkownika ' + user.login : 'Aktywuj użytkownika ' + user.login}">
                                                Dezaktywuj
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
