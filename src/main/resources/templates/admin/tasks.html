<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderacja zadań – bookRoot Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<main role="main" class="flex-grow-1 py-4">
    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 fw-bold mb-0">Moderacja zadań</h1>
                <p class="text-muted small mb-0">Zadania oczekujące na weryfikację (PENDING)</p>
            </div>
            <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm"
               aria-label="Wróć do panelu admina">← Panel admina</a>
        </div>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(pendingTasks)}"
             class="text-center py-5 text-muted">
            <div class="display-6 mb-3"></div>
            <p class="lead">Brak zadań do moderacji.</p>
        </div>

        <!-- Tasks table -->
        <div th:unless="${#lists.isEmpty(pendingTasks)}" class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0" aria-label="Lista zadań do moderacji">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Tytuł</th>
                                <th scope="col">Kategoria</th>
                                <th scope="col">Typ</th>
                                <th scope="col">Autor</th>
                                <th scope="col">Data</th>
                                <th scope="col" class="text-center">Akcje</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="task : ${pendingTasks}">
                                <td class="align-middle">
                                    <small class="text-muted" th:text="${task.id}">1</small>
                                </td>
                                <td class="align-middle">
                                    <a th:href="@{/tasks/{id}(id=${task.id})}"
                                       th:text="${task.title}"
                                       class="fw-semibold text-decoration-none"
                                       th:aria-label="'Podgląd zadania: ' + ${task.title}">
                                        Tytuł
                                    </a>
                                </td>
                                <td class="align-middle">
                                    <span class="badge bg-secondary"
                                          th:text="${task.categoryName}">Kat</span>
                                </td>
                                <td class="align-middle">
                                    <span class="badge bg-info text-dark"
                                          th:text="${task.taskType}">Typ</span>
                                </td>
                                <td class="align-middle small text-muted"
                                    th:text="${task.authorName ?: 'Anonim'}">Autor</td>
                                <td class="align-middle small text-muted"
                                    th:text="${#temporals.format(task.createdDate, 'dd.MM.yyyy')}">Data</td>
                                <td class="align-middle text-center">
                                    <div class="d-flex gap-1 justify-content-center">
                                        <!-- Approve -->
                                        <form th:action="@{/admin/tasks/{id}/approve(id=${task.id})}"
                                              method="post" class="d-inline">
                                            <button type="submit"
                                                    class="btn btn-success btn-sm"
                                                    th:aria-label="'Zatwierdź zadanie: ' + ${task.title}">
                                                ✓ Zatwierdź
                                            </button>
                                        </form>
                                        <!-- Reject -->
                                        <form th:action="@{/admin/tasks/{id}/reject(id=${task.id})}"
                                              method="post" class="d-inline">
                                            <button type="submit"
                                                    class="btn btn-danger btn-sm"
                                                    th:aria-label="'Odrzuć zadanie: ' + ${task.title}">
                                                ✗ Odrzuć
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmxI3wH4U+VE4PVjuoFh60drI4L6N"
        crossorigin="anonymous"></script>
</body>
</html>
