<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kolejka moderacji – bookRoot Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main role="main" class="main-content-container flex-grow-1 py-4">
    <div class="container" style="max-width: 900px;">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 fw-bold mb-0">Zarządzanie zadaniami (Admin)</h1>
                <p class="text-muted small mb-0">Zatwierdzaj lub odrzucaj nadesłane zadania</p>
            </div>
            <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">← Panel admina</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>


        <div th:if="${#lists.isEmpty(pendingTasks)}" class="text-center py-5 text-muted card border-0 shadow-sm">
            <div class="display-6 mb-3"></div>
            <p class="lead mb-0">Brak zadań oczekujących na moderację.</p>
        </div>


        <div class="accordion shadow-sm" id="moderationAccordion" th:unless="${#lists.isEmpty(pendingTasks)}">
            <div class="accordion-item border-0 mb-2 rounded shadow-sm overflow-hidden" th:each="task : ${pendingTasks}">
                <h2 class="accordion-header" th:id="'heading-' + ${task.id}">
                    <button class="accordion-button collapsed bg-white py-3" type="button"
                            th:data-target="'#collapse-' + ${task.id}">
                        <div class="w-100 me-3">
                            <div class="d-flex justify-content-between align-items-center mb-1 flex-wrap gap-1">
                                <span class="badge bg-secondary small" th:text="${task.categoryName}">Kategoria</span>
                                <small class="text-muted" th:text="${#temporals.format(task.createdDate, 'dd.MM.yyyy')}">Data</small>
                            </div>
                            <span class="fw-bold text-dark h6 mb-0" th:text="${task.title}">Tytuł zadania</span>
                        </div>
                    </button>
                </h2>
                <div th:id="'collapse-' + ${task.id}" class="accordion-collapse collapse"
                     data-parent="#moderationAccordion">
                    <div class="accordion-body bg-white border-top">
                        

                        <div class="row g-3 mb-3 pb-3 border-bottom text-muted small">
                            <div class="col-sm-4">
                                <strong>Użytkownik (Autor):</strong> <br>
                                <span th:text="${task.anonymous ? 'Anonim (Tryb anonimowy)' : (task.authorName != null ? task.authorName : 'Brak danych')}">Autor</span>
                            </div>
                            <div class="col-sm-4">
                                <strong>Data publikacji:</strong> <br>
                                <span th:text="${#temporals.format(task.createdDate, 'dd.MM.yyyy')}">Data</span>
                            </div>
                            <div class="col-sm-4 text-sm-end d-flex align-items-center justify-content-sm-end mt-2 mt-sm-0">
                                <a th:href="@{/tasks/{id}(id=${task.id})}" target="_blank" class="btn btn-sm btn-outline-primary fw-semibold">
                                     Podgląd zadania w nowym oknie
                                </a>
                            </div>
                        </div>

                        <div class="mb-3">
                            <h6 class="fw-semibold text-muted small text-uppercase">Treść zadania:</h6>
                            <p style="white-space: pre-line;" th:text="${task.content}" class="text-dark bg-light p-3 rounded border">Treść</p>
                        </div>

                        <div th:if="${task.imageUrl != null and !#strings.isEmpty(task.imageUrl)}" class="mb-3">
                            <h6 class="fw-semibold text-muted small">Załącznik graficzny:</h6>
                            <img th:src="${task.imageUrl}" alt="Załącznik graficzny zadania" class="img-fluid rounded shadow-sm" style="max-height: 300px;">
                        </div>

                        <div th:if="${task.sourceUrl != null and !#strings.isEmpty(task.sourceUrl)}" class="mb-3">
                            <h6 class="fw-semibold text-muted small">Źródło:</h6>
                            <a th:href="${task.sourceUrl}" target="_blank" rel="noopener noreferrer" class="small text-primary" th:text="${task.sourceUrl}">Link</a>
                        </div>

                        <div class="d-flex gap-2 justify-content-end border-top pt-3">
                            <form th:action="@{/admin/tasks/{id}/approve(id=${task.id})}" method="post">
                                <button type="submit" class="btn btn-success btn-sm fw-semibold">Zatwierdź zadanie</button>
                            </form>
                            <form th:action="@{/admin/tasks/{id}/reject(id=${task.id})}" method="post">
                                <button type="submit" class="btn btn-danger btn-sm fw-semibold">Odrzuć zadanie</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const accordion = document.getElementById('moderationAccordion');
        if (!accordion) return;

        accordion.addEventListener('click', function (e) {
            const btn = e.target.closest('.accordion-button');
            if (!btn) return;

            e.preventDefault();
            const targetSelector = btn.getAttribute('th:data-target') || btn.getAttribute('data-target');
            const targetEl = document.querySelector(targetSelector);
            if (!targetEl) return;

            const isCollapsed = btn.classList.contains('collapsed');

            const parentSelector = targetEl.getAttribute('data-parent');
            if (parentSelector) {
                const parent = document.querySelector(parentSelector);
                if (parent) {
                    parent.querySelectorAll('.accordion-collapse.show').forEach(openEl => {
                        if (openEl !== targetEl) {
                            openEl.classList.remove('show');
                            const associatedBtn = parent.querySelector(`[data-target="#${openEl.id}"]`) || 
                                                  parent.querySelector(`[th:data-target="#${openEl.id}"]`);
                            if (associatedBtn) {
                                associatedBtn.classList.add('collapsed');
                            }
                        }
                    });
                }
            }

            if (isCollapsed) {
                btn.classList.remove('collapsed');
                targetEl.classList.add('show');
            } else {
                btn.classList.add('collapsed');
                targetEl.classList.remove('show');
            }
        });
    });
</script>
</body>
</html>
