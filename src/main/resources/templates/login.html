<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie – bookRoot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<main role="main" class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="card shadow border-0" style="max-width:420px; width:100%;">
        <div class="card-header bg-dark text-white text-center py-3">
            <h1 class="h4 mb-0 fw-bold">
                <span style="color:#f97316;"></span> bookRoot
            </h1>
            <p class="mb-0 small text-white-50">Zaloguj się do konta</p>
        </div>
        <div class="card-body p-4">

            <!-- Error messages -->
            <div th:if="${param.error}" class="alert alert-danger small" role="alert">
                Nieprawidłowy login lub hasło.
            </div>
            <div th:if="${param.logout}" class="alert alert-success small" role="alert">
                Zostałeś wylogowany.
            </div>

            <form th:action="@{/login}" method="post" novalidate>

                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold small">Login</label>
                    <input type="text" class="form-control" id="username" name="username"
                           autocomplete="username" required autofocus
                           placeholder="Twój login">
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold small">Hasło</label>
                    <input type="password" class="form-control" id="password" name="password"
                           autocomplete="current-password" required
                           placeholder="Twoje hasło">
                </div>

                <button type="submit" class="btn btn-dark w-100 fw-semibold"
                        aria-label="Zaloguj się">
                    Zaloguj się
                </button>
            </form>
        </div>
        <div class="card-footer bg-white text-center py-3">
            <small class="text-muted">
                Nie masz konta?
                <a th:href="@{/register}" class="fw-semibold text-decoration-none"
                   aria-label="Przejdź do rejestracji">Zarejestruj się</a>
            </small>
        </div>
    </div>
</main>

<footer class="py-3 bg-dark text-white text-center" role="contentinfo">
    <small class="text-white-50">&copy; 2026 bookRoot</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmxI3wH4U+VE4PVjuoFh60drI4L6N"
        crossorigin="anonymous"></script>
</body>
</html>
