<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Lista zadań – bookRoot</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header role="banner">
    <h1>📚 bookRoot</h1>
    <nav>
        <a href="/">Główna</a>
        <span sec:authorize="isAuthenticated()">
            <a th:href="@{/tasks/new}">Dodaj zadanie</a>
            <a th:href="@{/profile/edit}">Profil</a>
            <form th:action="@{/logout}" method="post" style="display:inline">
                <button type="submit">Wyloguj</button>
            </form>
        </span>
        <span sec:authorize="!isAuthenticated()">
            <a th:href="@{/login}">Zaloguj</a>
        </span>
    </nav>
</header>

<main>
    <h2>Zadania</h2>
    <form method="get" th:action="@{/tasks}" class="filters">
        <label for="category">Kategoria:</label>
        <select name="categoryId" id="category">
            <option value="">Wszystkie</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}"
                    th:text="${cat.name} + ' (' + ${cat.taskCount} + ')'"></option>
        </select>
        <label for="since">Od:</label>
        <select name="since" id="since">
            <option value="">Dowolnie</option>
            <option value="2025-01-01">Ostatni tydzień</option>
            <option value="2024-12-01">Ostatni miesiąc</option>
        </select>
        <button type="submit">Filtruj</button>
    </form>

    <div class="sort-links">
        Sortuj:
        <a th:href="@{/tasks(sortField='title',sortDir='asc')}">Tytuł ▲</a>
        <a th:href="@{/tasks(sortField='title',sortDir='desc')}">▼</a>
        <a th:href="@{/tasks(sortField='createdDate',sortDir='desc')}">Data ▼</a>
    </div>

    <div th:if="${#lists.isEmpty(tasks.content)}">
        <p>Brak zadań do wyświetlenia.</p>
    </div>

    <div th:each="task : ${tasks.content}" class="task-card">
        <h3><a th:href="@{/tasks/{id}(id=${task.id})}" th:text="${task.title}">Tytuł</a></h3>
        <p th:text="${#strings.abbreviate(task.content, 150)}">Treść</p>
        <span th:text="${task.categoryName}">kategoria</span> |
        <span th:if="${task.authorName != null}" th:text="${task.authorName}">autor</span>
        <span th:if="${task.authorName == null}">Anonim</span> |
        <span th:text="${#dates.format(task.createdDate, 'dd.MM.yyyy')}">data</span>
    </div>

    <div th:if="${tasks.totalPages > 1}" class="pagination">
        <a th:text="${cat.name + ' (' + cat.taskCount + ')'}"
           th:href="@{/tasks(page=${i})}" th:text="${i+1}"></a>
    </div>
</main>
<footer><p>&copy; 2025 bookRoot</p></footer>
</body>
</html>
