<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lista zadań egzaminacyjnych – bookRoot. Filtruj i sortuj zadania według kategorii, daty i typu.">
    <title>Lista zadań – bookRoot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<main role="main" class="flex-grow-1 py-4">
    <div class="container">

        <!-- Page title -->
        <div class="row mb-4 align-items-center">
            <div class="col">
                <h1 class="h2 fw-bold mb-0">Zadania</h1>
                <p class="text-muted small" th:text="'Znaleziono: ' + ${tasks.totalElements} + ' zadań'">
                    Liczba wyników
                </p>
            </div>
            <div class="col-auto" sec:authorize="isAuthenticated()">
                <a th:href="@{/tasks/new}" class="btn btn-warning fw-semibold"
                   aria-label="Dodaj nowe zadanie">
                    + Dodaj zadanie
                </a>
            </div>
        </div>

        <!-- Filters & Sort -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <form method="get" th:action="@{/tasks}" id="filterForm">

                    <div class="row g-3 align-items-end">

                        <!-- Kategoria -->
                        <div class="col-md-3">
                            <label for="categoryId" class="form-label fw-semibold small">Kategoria</label>
                            <select name="categoryId" id="categoryId" class="form-select form-select-sm">
                                <option value="">Wszystkie</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:selected="${param.categoryId != null and #strings.toString(cat.id) == #strings.toString(param.categoryId)}"
                                        th:text="${cat.name}">
                                    Kategoria
                                </option>
                            </select>
                        </div>

                        <!-- Typ zadania (V6 / taskType) -->
                        <div class="col-md-3">
                            <label for="taskType" class="form-label fw-semibold small">Typ zadania</label>
                            <select name="taskType" id="taskType" class="form-select form-select-sm">
                                <option value="">Wszystkie typy</option>
                                <option value="OPEN"            th:selected="${param.taskType == 'OPEN'}">Otwarte</option>
                                <option value="CLOSED"          th:selected="${param.taskType == 'CLOSED'}">Zamknięte</option>
                                <option value="MULTIPLE_CHOICE" th:selected="${param.taskType == 'MULTIPLE_CHOICE'}">Wielokrotny wybór</option>
                                <option value="TRUE_FALSE"      th:selected="${param.taskType == 'TRUE_FALSE'}">Prawda/Fałsz</option>
                            </select>
                        </div>

                        <!-- Data od -->
                        <div class="col-md-3">
                            <label for="since" class="form-label fw-semibold small">Data od</label>
                            <input type="date" name="since" id="since" class="form-control form-control-sm"
                                   th:value="${param.since}">
                        </div>

                        <!-- Szukaj -->
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-primary btn-sm w-100"
                                    aria-label="Zastosuj filtry">
                                🔍 Filtruj
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Sort links -->
        <div class="d-flex flex-wrap gap-2 mb-4 align-items-center">
            <span class="text-muted small fw-semibold">Sortuj:</span>
            <a class="btn btn-outline-secondary btn-sm"
               th:href="@{/tasks(sortField='title',sortDir='asc',categoryId=${param.categoryId},since=${param.since},taskType=${param.taskType})}">
                Tytuł ▲
            </a>
            <a class="btn btn-outline-secondary btn-sm"
               th:href="@{/tasks(sortField='title',sortDir='desc',categoryId=${param.categoryId},since=${param.since},taskType=${param.taskType})}">
                Tytuł ▼
            </a>
            <a class="btn btn-outline-secondary btn-sm"
               th:href="@{/tasks(sortField='createdDate',sortDir='desc',categoryId=${param.categoryId},since=${param.since},taskType=${param.taskType})}">
                Najnowsze ▼
            </a>
            <a class="btn btn-outline-secondary btn-sm"
               th:href="@{/tasks(sortField='createdDate',sortDir='asc',categoryId=${param.categoryId},since=${param.since},taskType=${param.taskType})}">
                Najstarsze ▲
            </a>
            <a class="btn btn-outline-secondary btn-sm"
               th:href="@{/tasks(sortField='popularity',sortDir='desc',categoryId=${param.categoryId},since=${param.since},taskType=${param.taskType})}">
                Popularność ▼
            </a>
        </div>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(tasks.content)}" class="text-center py-5 text-muted">
            <div class="display-6 mb-3">📭</div>
            <p class="lead">Brak zadań spełniających kryteria.</p>
            <a th:href="@{/tasks}" class="btn btn-outline-secondary btn-sm"
               aria-label="Wyczyść filtry i pokaż wszystkie">
                Wyczyść filtry
            </a>
        </div>

        <!-- Task cards grid -->
        <div class="row row-cols-1 row-cols-lg-2 g-3" th:unless="${#lists.isEmpty(tasks.content)}">
            <div class="col" th:each="task : ${tasks.content}">
                <div class="card h-100 shadow-sm border-0 task-card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="badge bg-secondary small" th:text="${task.categoryName}">Kategoria</span>
                            <span class="badge rounded-pill bg-primary small"
                                  th:text="${task.taskType != null ? task.taskType : 'OPEN'}">Typ</span>
                        </div>
                        <h2 class="card-title h5 fw-semibold">
                            <a th:href="@{/tasks/{id}(id=${task.id})}"
                               th:text="${task.title}"
                               class="text-decoration-none text-dark stretched-link">
                                Tytuł
                            </a>
                        </h2>
                        <p class="card-text text-muted small"
                           th:text="${#strings.abbreviate(task.content, 140)}">
                            Treść...
                        </p>
                    </div>
                    <div class="card-footer bg-transparent pt-0 d-flex justify-content-between align-items-center">
                        <small class="text-muted">
                            <span th:if="${task.anonymous}">Anonim</span>
                            <span th:unless="${task.anonymous}" th:text="${task.authorName}">Autor</span>
                            &bull;
                            <span th:text="${#temporals.format(task.createdDate, 'dd.MM.yyyy')}">Data</span>
                        </small>
                        <small class="text-muted">
                            👁 <span th:text="${task.viewCount != null ? task.viewCount : 0}">0</span>
                        </small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <nav aria-label="Paginacja zadań" class="mt-4" th:if="${tasks.totalPages > 1}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${tasks.first} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/tasks(page=${tasks.number - 1}, categoryId=${param.categoryId}, since=${param.since}, sortField=${sortField}, sortDir=${sortDir}, taskType=${param.taskType})}"
                       aria-label="Poprzednia strona">‹</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, tasks.totalPages - 1)}"
                    th:classappend="${tasks.number == i} ? 'active'">
                    <a class="page-link"
                       th:href="@{/tasks(page=${i}, categoryId=${param.categoryId}, since=${param.since}, sortField=${sortField}, sortDir=${sortDir}, taskType=${param.taskType})}"
                       th:text="${i + 1}"
                       th:aria-label="'Strona ' + ${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${tasks.last} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/tasks(page=${tasks.number + 1}, categoryId=${param.categoryId}, since=${param.since}, sortField=${sortField}, sortDir=${sortDir}, taskType=${param.taskType})}"
                       aria-label="Następna strona">›</a>
                </li>
            </ul>
        </nav>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmxI3wH4U+VE4PVjuoFh60drI4L6N"
        crossorigin="anonymous"></script>
</body>
</html>
