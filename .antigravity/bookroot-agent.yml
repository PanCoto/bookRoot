########################################################################
#  INSTRUKCJE DLA AGENTA
########################################################################

agent_instructions:
  general:
    - >
      Gdy użytkownik pyta o wygenerowanie klasy encji, zawsze dodaj:
      adnotacje JPA (@Entity, @Table, @Id, @GeneratedValue, relacje),
      adnotacje walidacyjne Bean Validation,
      Lombok (@Data / @Builder / @AllArgsConstructor / @NoArgsConstructor),
      pole createdAt z @CreationTimestamp.
    - >
      Gdy użytkownik pyta o kontroler MVC, generuj metodę według wzorca:
      @GetMapping → Model + String viewName,
      @PostMapping → BindingResult walidacja → redirect lub błąd.
    - >
      Gdy użytkownik pyta o REST endpoint, generuj:
      @RestController, @RequestMapping("/api/..."),
      ResponseEntity<T> jako typ zwrotny,
      GlobalExceptionHandler obsłużony.
    - >
      Zawsze informuj, które punkty z listy wymagań realizuje dany kod.
    - >
      Dla każdej nowej klasy serwisu generuj odpowiadający interfejs
      i implementację (@Service), wstrzykiwanie przez konstruktor.

  code_style:
    - "Pakiet bazowy: com.bookroot"
    - "Nazwy klas: UpperCamelCase"
    - "Nazwy metod: lowerCamelCase"
    - "Stałe: UPPER_SNAKE_CASE"
    - "Komentarze w kodzie: angielski"
    - "Komunikaty dla użytkownika: polski"
    - "Każda klasa publiczna = osobny plik .java"

  forbidden_patterns:
    - "NIE przechowuj haseł w plaintext – zawsze BCrypt"
    - "NIE ujawniaj stack trace w odpowiedziach HTTP dla użytkownika"
    - "NIE używaj @Autowired na polach – używaj constructor injection"
    - "NIE umieszczaj logiki biznesowej w kontrolerach"
    - "NIE zwracaj encji JPA bezpośrednio z REST – używaj DTO"

  when_asked_about:
    security: >
      Zawsze odnieś się do SecurityConfig, ról i uprawnień zdefiniowanych
      w sekcji security.roles. Sprawdź czy operacja wymaga autoryzacji
      (@PreAuthorize lub httpSecurity.authorizeHttpRequests).
    session: >
      Opisz VoteCollector i SortPreferences. Przypomnij o SessionFlushLogoutHandler.
    rest: >
      Wygeneruj endpoint zgodny ze strukturą rest_api.endpoints.
      Użyj DTO z sekcji dto.request / dto.response.
    entity: >
      Odwołaj się do sekcji domain_model. Wygeneruj pełną klasę
      z relacjami, walidacją i Lombok.
    thymeleaf: >
      Zastosuj WCAG 2.1. Użyj co najmniej 5 różnych znaczników th:*.
      Pamiętaj o sec:authorize dla widoczności elementów admin/user.
